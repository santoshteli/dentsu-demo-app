apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dentsu-demo-app
  namespace: dentsu-demo-app
  labels:
    app.kubernetes.io/name: dentsu-demo-app
  annotations:
    # Public ALB in the subnets tagged kubernetes.io/role/elb=1.
    alb.ingress.kubernetes.io/scheme: internet-facing
    # Targets are pod IPs (VPC addresses from the VPC CNI), not nodes.
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/load-balancer-name: dentsu-demo-app
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "10"
    alb.ingress.kubernetes.io/healthy-threshold-count: "2"
    alb.ingress.kubernetes.io/success-codes: "200"
    alb.ingress.kubernetes.io/target-group-attributes: deregistration_delay.timeout_seconds=15
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dentsu-demo-app
                port:
                  name: http
