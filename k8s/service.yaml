apiVersion: v1
kind: Service
metadata:
  name: dentsu-demo-app
  namespace: dentsu-demo-app
  labels:
    app.kubernetes.io/name: dentsu-demo-app
spec:
  # Internal only. The ALB reaches the pods directly by IP (target-type ip);
  # the Service tells the controller which pods and port to register.
  type: ClusterIP
  selector:
    app.kubernetes.io/name: dentsu-demo-app
  ports:
    - name: http
      port: 80
      targetPort: http
