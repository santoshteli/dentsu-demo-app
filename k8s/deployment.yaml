apiVersion: apps/v1
kind: Deployment
metadata:
  name: dentsu-demo-app
  namespace: dentsu-demo-app
  labels:
    app.kubernetes.io/name: dentsu-demo-app
spec:
  replicas: 2
  # Old ReplicaSets kept for "kubectl rollout undo".
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: dentsu-demo-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Start one new pod before stopping an old one: never below 2 serving.
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dentsu-demo-app
    spec:
      # The app never calls the Kubernetes API.
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          # Replaced at deploy time with <ECR registry>/dentsu-demo-app:<git SHA>.
          # The registry address contains the AWS account ID, so it is not
          # stored in this public repo.
          image: IMAGE_PLACEHOLDER
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          lifecycle:
            # Keep serving while the ALB drains this target (deregistration
            # delay is 15s in ingress.yaml), then the app gets SIGTERM.
            preStop:
              exec:
                command: ["sleep", "15"]
